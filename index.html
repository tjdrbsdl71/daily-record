<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 일상기록</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:20px;color:#222}
main{max-width:650px;margin:auto}
h1{color:#234b83}
section{background:white;padding:18px;border-radius:14px;margin:15px 0;box-shadow:0 2px 8px #ddd}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#2463b6;color:white;border:0;font-weight:bold}
.fields,.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.totals h3{margin:0 0 6px;font-size:1rem}
.totals p{margin:4px 0;overflow-wrap:anywhere}
.totals>div{padding:12px;background:#edf4ff;border-radius:8px}
@media(max-width:400px){.fields,.totals{grid-template-columns:1fr}}
article{border-bottom:1px solid #ddd;padding:12px 0;white-space:pre-wrap}
label{display:block;margin-top:8px}
button:disabled{opacity:.6}
[hidden]{display:none!important}
#error{color:#9b1c1c}
#status,#voice-status,#error{margin:8px 0}
#voice-preview{padding:8px 12px;background:#edf4ff;border-radius:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>📒 나의 일상기록</h1>
<button id="improvement-toggle" type="button" aria-expanded="false" aria-controls="improvement">프로그램 개선 요청</button>
<section id="improvement" hidden aria-labelledby="improvement-title">
<h2 id="improvement-title">프로그램 개선 요청</h2>
<p>요청 초안은 이 브라우저에 별도로 저장할 수 있습니다. 복사한 요청은 Codex에 붙여넣어 제출하세요.</p>
<label for="improvement-text">수정하거나 추가할 기능</label>
<textarea id="improvement-text" rows="5"></textarea>
<button id="improvement-voice" type="button">🎤 요청 음성 입력 시작</button>
<button id="improvement-save" type="button">요청 초안 저장</button>
<button id="improvement-copy" type="button">요청 복사하고 Codex 열기</button>
<p id="improvement-status" role="status"></p>
<a id="open-codex" href="https://chatgpt.com/codex" target="_blank" rel="noopener noreferrer" hidden>Codex 새 탭에서 열기</a>
</section>
<section>
<h2 id="editor-title">새 기록</h2>
<form id="editor" novalidate>
<label for="date">날짜</label>
<input id="date" type="date">
<label for="category">분류</label>
<select id="category">
<option>일상</option>
</select>
<button id="auto-category" type="button">메모로 자동 분류</button>
<label for="memo">메모</label>
<textarea id="memo" rows="5" placeholder="오늘의 기록을 입력하세요"></textarea>
<button id="voice" type="button">🎤 음성 입력 시작</button>
<p id="voice-status" role="status">음성 입력 대기 중</p>
<p id="voice-preview" hidden>인식 중인 내용: <span id="voice-draft"></span></p>
<p id="amount-preview" role="status" hidden></p>
<button id="save" type="submit">기록 저장</button>
<button id="cancel-edit" type="button" hidden>수정 취소</button>
</form>
</section>
<section>
<h2>영수증으로 지출 기록</h2>
<form id="receipt-form">
<label for="receipt-photo">영수증 촬영 또는 사진 선택</label>
<input id="receipt-photo" type="file" accept="image/*" capture="environment" aria-describedby="receipt-status">
<p id="receipt-status" role="status">사진에서 날짜, 사용처, 결제 금액을 읽습니다.</p>
<fieldset id="receipt-fields" hidden disabled>
<legend>인식 결과 확인</legend>
<label for="receipt-date">결제 날짜</label>
<input id="receipt-date" type="date" required>
<label for="receipt-merchant">사용처</label>
<input id="receipt-merchant" type="text" required>
<label for="receipt-amount">결제 금액 (원)</label>
<input id="receipt-amount" type="number" inputmode="numeric" min="1" step="1" required>
<button id="receipt-save" type="submit">지출 기록 저장</button>
</fieldset>
</form>
</section>
<section>
<h2>백업 및 복원</h2>
<button id="backup" type="button">JSON 백업 다운로드</button>
<label for="backup-file">복원할 JSON 파일</label>
<input id="backup-file" type="file" accept=".json,application/json">
<button id="restore" type="button">기록 복원</button>
<p>복원한 기록은 현재 목록에 추가됩니다.</p>
</section>
<p id="status" role="status"></p>
<p id="error" role="alert"></p>
<section>
<h2>저장된 기록</h2>
<div class="fields">
<div><label for="filter-date">조회 날짜</label><input id="filter-date" type="date"></div>
<div><label for="filter-category">조회 분류</label><select id="filter-category"></select></div>
</div>
<button id="clear-filters" type="button">조회 조건 초기화</button>
<h3>수입·지출 합계</h3>
<p>날짜를 선택하면 해당 일과 월의 합계를 표시합니다. 분류 필터는 기록 목록에 적용됩니다.</p>
<div class="totals" id="totals"></div>
<div id="records"></div>
</section>
</main>
<script>
const key = 'daily-record-v1';
const byId = id => document.getElementById(id);
const form = byId('editor');
const date = byId('date');
const category = byId('category');
const memo = byId('memo');
const save = byId('save');
const fileInput = byId('backup-file');
const restore = byId('restore');
const voice = byId('voice');
const voiceStatus = byId('voice-status');
const voicePreview = byId('voice-preview');
const voiceDraft = byId('voice-draft');
let editingId = null;
let editingReceipt = null;
let voiceInput = null;
let categoryOverride = false;
const filterDate = byId('filter-date');
const filterCategory = byId('filter-category');
const categories = ['일상', '지출', '수입', '운동', '체중', '병원', '보험', '스크린골프',
  '훌라', '가족', '회사 업무', '병원·보험', '골프·훌라', '기타'];
const categoryRules = [
  ['스크린골프', /스크린\s*골프|골프존|카카오\s*vx|골프/i],
  ['훌라', /훌라/],
  ['보험', /보험|실손|실비/],
  ['병원', /병원|의원|진료|약국|처방|치과|검진|입원/],
  ['체중', /체중|몸무게|(?:\d|[킬키])\s*(?:kg\b|킬로(?:그램)?|키로)/i],
  ['회사 업무', /회사|업무|회의|출근|퇴근|보고서|거래처|프로젝트|출장/],
  ['운동', /운동|헬스|러닝|달리기|걷기|산책|수영|요가|필라테스|등산|자전거|근력/],
  ['가족', /가족|엄마|아빠|부모님|어머니|아버지|아들|딸|남편|아내|배우자|아이와/],
];
const moneyCue = /(?<income>수입|월급|급여|보너스|환급|환불|입금|매출|용돈을?\s*받|받았|받음|받다|들어왔|들어옴)|(?<expense>지출|결제|구매|구입|출금|이체|납부|지불|소비|썼|씀|냈|낸|냄|사용했)/g;
const wordDigits = {영: 0, 공: 0, 일: 1, 이: 2, 삼: 3, 사: 4, 오: 5, 육: 6, 칠: 7, 팔: 8, 구: 9};
const smallUnits = {천: 1000, 백: 100, 십: 10};
const largeUnits = {억: 100000000, 만: 10000};
const currency = new Intl.NumberFormat('ko-KR');

function todayDate() {
  const today = new Date();
  return new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function option(label, value = label) {
  const item = document.createElement('option');
  item.textContent = label;
  item.value = value;
  return item;
}

function setCategories(select, names, selected) {
  select.replaceChildren(...names.map(name => option(name || '전체 분류', name)));
  select.value = selected;
}

function parseWon(text) {
  let total = 0;
  let group = 0;
  let number = null;
  for (const [token] of text.matchAll(/[\d,]+(?:\.\d+)?|[영공일이삼사오육칠팔구천백십억만]/g)) {
    if (token in largeUnits) {
      total += (group + (number ?? (group ? 0 : 1))) * largeUnits[token];
      group = 0;
      number = null;
    } else if (token in smallUnits) {
      group += (number ?? 1) * smallUnits[token];
      number = null;
    } else {
      number = wordDigits[token] ?? Number(token.replaceAll(',', ''));
    }
  }
  return total + group + (number ?? 0);
}

function analyze(text, recordedCategory = '') {
  const totals = {income: 0, expense: 0};
  const normalized = text.normalize('NFKC');
  // Keep decimal points and thousands separators inside amounts.
  const clauses = normalized.split(/\n|[!?;]|(?<!\d)\.(?!\d)|,(?!\d)|\s+(?:그리고|하지만|반면|또는)\s+/);
  for (const clause of clauses) {
    const cues = [...clause.matchAll(moneyCue)];
    const amounts = [...clause.matchAll(/₩\s*([\d,]+(?:\.\d+)?)|([\d영공일이삼사오육칠팔구천백십억만][\d,\.\s영공일이삼사오육칠팔구천백십억만]*?)\s*원(?!장|래|인|본|료)/g)];
    // A numeric amount without a currency marker needs an explicit nearby money label.
    for (const cue of cues) {
      if (!/^(?:수입|지출|월급|급여|보너스|환급|환불|입금|매출|결제|출금|납부)$/.test(cue[0])) continue;
      const start = cue.index + cue[0].length;
      const bare = /^\s*[:：]?\s*(\d+(?:,\d{3})*)(?![\d,.%/:\-])(?=\s|$)/.exec(clause.slice(start));
      if (!bare) continue;
      const index = start + bare[0].length - bare[1].length;
      if (amounts.some(amount => amount.index <= index && index < amount.index + amount[0].length)) continue;
      if (/^\s*(?:개월|시간|분|초|일|월|년|회|명|개|건|번|kg\b|km\b|원|만원|천원|만|천|억)/i.test(clause.slice(index + bare[1].length))) continue;
      const value = parseWon(bare[1]);
      if (Number.isSafeInteger(value) && value > 0) totals[cue.groups.income ? 'income' : 'expense'] += value;
    }
    for (const [index, amount] of amounts.entries()) {
      const value = parseWon(amount[1] ?? amount[2]);
      if (!Number.isSafeInteger(value) || value <= 0) continue;
      const end = amount.index + amount[0].length;
      const previous = amounts[index - 1];
      const lower = previous ? previous.index + previous[0].length : 0;
      const upper = amounts[index + 1]?.index ?? clause.length;
      const before = cues.findLast(cue => cue.index >= lower && cue.index < amount.index);
      const after = cues.find(cue => cue.index >= end && cue.index < upper);
      // For successive amounts, prefer a verb immediately after the current amount.
      const gap = after ? clause.slice(end, after.index) : '';
      const attachesToAmount = /^\s*[을를이가은는]/.test(gap) ||
        /^(?:받았|받음|받다|들어왔|들어옴|썼|씀|냈|낸|냄|사용했)$/.test(after?.[0] ?? '');
      const cue = after && (!before || (attachesToAmount && /^[\s을를이가은는]*$/.test(gap))) ? after : before;
      const type = cue ? (cue.groups.income ? 'income' : 'expense') : null;
      // Bare amounts count only if the clause contains a purchase context.
      if (type) totals[type] += value;
      else if (/식비|점심|저녁|커피|카페|쇼핑|장보기|교통비|택시|주유|병원비|진료비|약값|보험료|이용료|회비|생활비|비용|요금|가격|샀/.test(clause)) {
        totals.expense += value;
      } else if (recordedCategory === '지출' || recordedCategory === '수입') {
        totals[recordedCategory === '수입' ? 'income' : 'expense'] += value;
      }
    }
  }
  const matched = categoryRules.find(([, pattern]) => pattern.test(normalized));
  let suggested = matched?.[0] ?? '일상';
  if (!matched) {
    if (totals.expense || /지출|결제|구매|구입|납부|샀/.test(normalized)) suggested = '지출';
    else if (totals.income || /수입|월급|급여|보너스|환급|입금/.test(normalized)) suggested = '수입';
  }
  return {...totals, category: suggested};
}

function recordAmounts(record) {
  if (Number.isSafeInteger(record.receiptAmount) && record.receiptAmount > 0) {
    return {income: 0, expense: record.receiptAmount};
  }
  return analyze(record.memo, record.category);
}

function moneyText(amount) {
  return currency.format(amount) + '원';
}

function updateAnalysis() {
  const text = memo.value.trim();
  const result = editingReceipt?.memo === text
    ? {...recordAmounts(editingReceipt), category: '지출'}
    : analyze(text, categoryOverride ? category.value : '');
  if (!categoryOverride) category.value = result.category;
  const preview = byId('amount-preview');
  preview.hidden = !result.income && !result.expense;
  preview.textContent = '추출된 금액 · 수입 ' + moneyText(result.income) + ' / 지출 ' + moneyText(result.expense);
}

category.addEventListener('change', () => {
  categoryOverride = true;
  updateAnalysis();
});
memo.addEventListener('input', updateAnalysis);
byId('auto-category').onclick = () => {
  categoryOverride = false;
  updateAnalysis();
};

function report(message = '', isError = false) {
  byId('status').textContent = isError ? '' : message;
  byId('error').textContent = isError ? message : '';
}

function validRecord(record) {
  return record && typeof record.date === 'string' &&
    typeof record.category === 'string' && typeof record.memo === 'string';
}

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)),
    byte => byte.toString(16).padStart(2, '0')).join('');
}

function withIds(records) {
  const reserved = new Set(records.map(record => record.id));
  const used = new Set();
  return records.map(record => {
    let {id} = record;
    if (typeof id !== 'string' || !id.trim() || used.has(id)) {
      do { id = newId(); } while (reserved.has(id) || used.has(id));
    }
    used.add(id);
    return id === record.id ? record : {...record, id};
  });
}

function writeRecords(records) {
  try {
    localStorage.setItem(key, JSON.stringify(records));
  } catch {
    throw new Error('기록을 저장할 수 없습니다. 브라우저의 저장 공간과 사이트 데이터 설정을 확인해 주세요.');
  }
}

function readRecords() {
  let records;
  try {
    const raw = localStorage.getItem(key);
    records = raw === null ? [] : JSON.parse(raw);
    if (!Array.isArray(records) || !records.every(validRecord)) throw new Error();
  } catch {
    throw new Error('저장된 기록을 읽을 수 없습니다. 브라우저의 사이트 데이터 설정이나 저장 형식을 확인해 주세요.');
  }
  const migrated = withIds(records);
  if (migrated.some((record, index) => record !== records[index])) writeRecords(migrated);
  return migrated;
}

function withRecords(operation) {
  const run = () => operation(readRecords());
  if (navigator.locks) return navigator.locks.request(key, run);
  return Promise.resolve().then(run);
}

function stopVoiceForEditor() {
  if (voiceInput?.button !== voice) return;
  const session = voiceInput.session;
  finishVoice('음성 입력 종료');
  try {
    session?.abort();
  } catch {
    report('마이크 세션을 종료하지 못했습니다.', true);
  }
}

function setEditor(record) {
  stopVoiceForEditor();
  editingId = record?.id ?? null;
  editingReceipt = Number.isSafeInteger(record?.receiptAmount) && record.receiptAmount > 0 ? record : null;
  form.reset();
  date.value = record?.date ?? todayDate();
  const names = [...new Set([...categories, ...(record ? [record.category] : [])])];
  setCategories(category, names, record?.category ?? '일상');
  categoryOverride = Boolean(record);
  if (record) memo.value = record.memo;
  updateAnalysis();
  byId('editor-title').textContent = record ? '기록 수정' : '새 기록';
  save.textContent = record ? '수정 저장' : '기록 저장';
  byId('cancel-edit').hidden = !record;
}

function summaryCard(title, amounts) {
  const card = document.createElement('div');
  const heading = document.createElement('h3');
  const income = document.createElement('p');
  const expense = document.createElement('p');
  heading.textContent = title;
  income.textContent = '수입 ' + moneyText(amounts.income);
  expense.textContent = '지출 ' + moneyText(amounts.expense);
  card.append(heading, income, expense);
  return card;
}

function render(records) {
  const selected = filterCategory.value;
  const names = [...new Set([...categories, ...records.map(record => record.category)])];
  setCategories(filterCategory, ['', ...names], names.includes(selected) ? selected : '');
  const day = filterDate.value || todayDate();
  const month = day.slice(0, 7);
  const daily = {income: 0, expense: 0};
  const monthly = {income: 0, expense: 0};
  const visible = [];
  for (const record of records) {
    const amounts = recordAmounts(record);
    if (record.date === day) {
      daily.income += amounts.income;
      daily.expense += amounts.expense;
    }
    if (record.date.slice(0, 7) === month) {
      monthly.income += amounts.income;
      monthly.expense += amounts.expense;
    }
    if ((!filterDate.value || record.date === filterDate.value) &&
        (!filterCategory.value || record.category === filterCategory.value)) visible.push({record, amounts});
  }
  byId('totals').replaceChildren(
    summaryCard(day + ' 일별', daily), summaryCard(month + ' 월별', monthly));
  const target = byId('records');
  target.replaceChildren();
  if (!visible.length) target.textContent = records.length ? '조회 조건에 맞는 기록이 없습니다.' : '저장된 기록이 없습니다.';
  for (const {record, amounts} of visible) {
    const article = document.createElement('article');
    const heading = document.createElement('strong');
    heading.textContent = record.date + ' · ' + record.category;
    const content = document.createElement('p');
    content.textContent = record.memo;
    const edit = document.createElement('button');
    edit.textContent = '수정';
    edit.onclick = () => {
      if (save.disabled) return;
      if (voiceInput?.button === voice) {
        report('음성 입력을 종료한 뒤 기록을 수정해 주세요.');
        return;
      }
      setEditor(record);
      report();
      memo.focus();
    };
    const remove = document.createElement('button');
    remove.textContent = '삭제';
    remove.onclick = async () => {
      if (!confirm('삭제할까요?')) return;
      try {
        await withRecords(current => {
          if (editingId === record.id && voiceInput?.button === voice) {
            throw new Error('음성 입력을 종료한 뒤 수정 중인 기록을 삭제해 주세요.');
          }
          const remaining = current.filter(item => item.id !== record.id);
          if (remaining.length === current.length) throw new Error('이미 삭제된 기록입니다.');
          writeRecords(remaining);
          if (editingId === record.id) setEditor();
          render(remaining);
          report('기록을 삭제했습니다.');
        });
      } catch (error) {
        report(error.message, true);
      }
    };
    article.append(heading, content);
    if (amounts.income || amounts.expense) {
      const finance = document.createElement('p');
      finance.textContent = '수입 ' + moneyText(amounts.income) + ' / 지출 ' + moneyText(amounts.expense);
      article.append(finance);
    }
    article.append(edit, remove);
    target.append(article);
  }
}

form.onsubmit = event => {
  event.preventDefault();
  if (voiceInput?.button === voice) {
    report('음성 입력을 종료하면 자동으로 저장됩니다.');
    return;
  }
  saveEditor();
};

async function saveEditor() {
  if (save.disabled) return;
  updateAnalysis();
  const previousId = editingId;
  const draft = {date: date.value, category: category.value, memo: memo.value.trim()};
  if (!draft.memo) {
    report('메모를 입력해 주세요.', true);
    memo.focus();
    return;
  }
  if (!draft.date || !date.validity.valid) {
    report('날짜를 입력해 주세요.', true);
    date.focus();
    return;
  }
  save.disabled = true;
  try {
    await withRecords(records => {
      if (previousId) {
        const index = records.findIndex(record => record.id === previousId);
        if (index === -1) throw new Error('다른 탭에서 삭제된 기록입니다. 내용을 새 기록으로 저장하려면 복사해 주세요.');
        const original = records[index];
        const updated = {...original, ...draft};
        if (original.memo !== draft.memo) delete updated.receiptAmount;
        records[index] = updated;
      } else {
        records.unshift({...draft, id: newId()});
      }
      writeRecords(records);
      if (previousId) {
        setEditor();
      } else {
        stopVoiceForEditor();
        memo.value = '';
        categoryOverride = false;
        updateAnalysis();
      }
      render(records);
      report(previousId ? '수정한 기록을 저장했습니다.' : '기록을 저장했습니다.');
    });
  } catch (error) {
    report(error.message, true);
  } finally {
    save.disabled = false;
  }
}

byId('cancel-edit').onclick = () => {
  if (save.disabled) return;
  if (voiceInput?.button === voice) {
    report('음성 입력을 먼저 종료해 주세요.');
    return;
  }
  setEditor();
  report('수정을 취소했습니다.');
};

byId('backup').onclick = async () => {
  try {
    const records = await withRecords(current => current);
    const blob = new Blob([JSON.stringify({version: 1, records}, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'daily-record-backup.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    report('백업 다운로드를 시작했습니다. 백업 파일에는 메모 원문이 포함됩니다.');
  } catch (error) {
    report('백업에 실패했습니다. ' + error.message, true);
  }
};

function sameRecord(a, b) {
  return a.date === b.date && a.category === b.category && a.memo === b.memo;
}

function mergeBackup(current, incoming) {
  const byRecordId = new Map(current.map(record => [record.id, record]));
  const additions = [];
  for (const record of incoming) {
    const existing = byRecordId.get(record.id);
    if (existing && sameRecord(existing, record)) continue;
    if (existing) {
      if ([...current, ...additions].some(item =>
        item.restoredFromId === record.id && sameRecord(item, record))) continue;
      let id;
      do { id = newId(); } while (byRecordId.has(id));
      additions.push({...record, id, restoredFromId: record.id});
    } else {
      additions.push(record);
    }
    const added = additions[additions.length - 1];
    byRecordId.set(added.id, added);
  }
  return additions;
}

restore.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) {
    report('복원할 JSON 파일을 선택해 주세요.', true);
    return;
  }
  restore.disabled = true;
  try {
    let backup;
    try {
      backup = JSON.parse(await file.text());
    } catch {
      throw new Error('백업 파일을 읽을 수 없습니다. 올바른 JSON 파일을 선택해 주세요.');
    }
    const records = backup?.version === 1 ? backup.records : null;
    if (!Array.isArray(records) || !records.every(record =>
      validRecord(record) && typeof record.id === 'string' && record.id.trim()) ||
      new Set(records.map(record => record.id)).size !== records.length) {
      throw new Error('지원하지 않거나 손상된 백업 파일입니다.');
    }
    await withRecords(current => {
      const additions = mergeBackup(current, records);
      const merged = [...additions, ...current];
      if (additions.length) writeRecords(merged);
      render(merged);
      report(additions.length ? additions.length + '개의 기록을 복원했습니다.' : '추가할 새 기록이 없습니다.');
    });
    fileInput.value = '';
  } catch (error) {
    report(error.message, true);
  } finally {
    restore.disabled = false;
  }
};

function showVoiceDraft(text = '') {
  voiceDraft.textContent = text;
  voicePreview.hidden = !text;
}

function finishVoice(message) {
  const {button, status, startLabel, timer} = voiceInput;
  clearTimeout(timer);
  voiceInput = null;
  if (button === voice) showVoiceDraft();
  button.disabled = false;
  button.textContent = startLabel;
  status.textContent = message;
}

function completeVoiceInput() {
  preservePendingSpeech(voiceInput);
  const {button, hasTranscript} = voiceInput;
  finishVoice(hasTranscript ? '음성 입력 종료' : '인식된 음성이 없습니다.');
  if (button === voice && hasTranscript) saveEditor();
}

function appendSpeech(input, text) {
  if (!text) return;
  input.field.value = [input.field.value.trimEnd(), text].filter(Boolean).join(' ');
  input.hasTranscript = true;
  if (input.field === memo) updateAnalysis();
}

function preservePendingSpeech(input) {
  // A browser can end a session without delivering a final result for its last phrase.
  appendSpeech(input, input.pendingText);
  input.pendingText = '';
}

function restartRecognition(input, delay) {
  input.status.textContent = '음성 입력 다시 시작 중…';
  input.timer = setTimeout(() => startRecognition(input), delay);
}

function startRecognition(input) {
  if (voiceInput !== input || input.stopping) return;
  const {SpeechRecognition, button, status} = input;
  try {
    const session = new SpeechRecognition();
    input.session = session;
    session.lang = 'ko-KR';
    session.continuous = true;
    session.interimResults = true;
    const isCurrent = () => voiceInput === input && input.session === session;
    let retryDelay = 250;
    let blocked = false;
    let nextResult = 0;

    function endSession() {
      if (!isCurrent()) return;
      clearTimeout(input.timer);
      input.session = null;
      preservePendingSpeech(input);
      if (button === voice) showVoiceDraft();
      if (input.stopping) {
        completeVoiceInput();
      } else if (!blocked) {
        // Android Chrome can end recognition during silence in continuous mode.
        restartRecognition(input, retryDelay);
      }
    }

    session.onstart = () => {
      if (isCurrent() && !input.stopping) status.textContent = '음성 입력 중…';
    };
    session.onresult = event => {
      if (!isCurrent()) return;
      // Each event includes the session's earlier results; commit each final slot once.
      while (nextResult < event.results.length && event.results[nextResult].isFinal) {
        appendSpeech(input, event.results[nextResult][0].transcript.trim());
        nextResult++;
      }
      const pending = [];
      for (let index = nextResult; index < event.results.length; index++) {
        const text = event.results[index][0].transcript.trim();
        if (text) pending.push(text);
      }
      input.pendingText = pending.join(' ');
      if (button === voice) showVoiceDraft(input.pendingText);
    };
    session.onerror = event => {
      if (!isCurrent() || input.stopping) return;
      if (button === voice) showVoiceDraft();
      if (event.error === 'network') {
        retryDelay = 2000;
      } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
        blocked = true;
        const messages = {
          'not-allowed': 'Chrome의 사이트 설정과 휴대폰 설정에서 마이크 권한을 확인해 주세요.',
          'service-not-allowed': '브라우저가 음성 인식 서비스 사용을 허용하지 않습니다.',
          'audio-capture': '마이크가 연결되어 있고 사용할 수 있는지 확인해 주세요.'
        };
        status.textContent = (messages[event.error] ?? '음성 인식이 중단되었습니다.') +
          ' 종료 버튼을 눌러 입력을 마쳐 주세요.';
      }
      // Some failures report an error without dispatching the expected end event.
      clearTimeout(input.timer);
      input.timer = setTimeout(() => {
        endSession();
        try {
          session.abort();
        } catch {
          // The browser may have already ended the session.
        }
      }, 500);
    };
    session.onend = endSession;
    session.start();
  } catch (error) {
    input.session = null;
    if (error.name === 'InvalidStateError') {
      restartRecognition(input, 500);
    } else {
      status.textContent = '음성 인식을 시작할 수 없습니다. 종료 버튼을 누른 뒤 마이크 설정을 확인해 주세요.';
    }
  }
}

function toggleVoice(button, field, status) {
  if (button === voice && save.disabled) return;
  if (voiceInput) {
    const input = voiceInput;
    if (input.button !== button) {
      status.textContent = '다른 음성 입력을 먼저 종료해 주세요.';
      return;
    }
    if (input.stopping) return;
    clearTimeout(input.timer);
    const session = input.session;
    if (!session) {
      completeVoiceInput();
      return;
    }
    input.stopping = true;
    button.disabled = true;
    status.textContent = '음성 입력 종료 중…';
    // Allow Chrome to deliver the final result after the user presses Stop.
    input.timer = setTimeout(() => {
      completeVoiceInput();
      try {
        session.abort();
      } catch {
        // The browser may have already ended the session.
      }
    }, 3000);
    try {
      session.stop();
    } catch {
      // The timeout still preserves any final results received so far.
    }
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    status.textContent = '이 브라우저는 음성 입력을 지원하지 않습니다. Chrome에서 열거나 직접 입력해 주세요.';
    return;
  }
  if (button === voice) report();
  voiceInput = {
    SpeechRecognition, button, field, status, startLabel: button.textContent,
    session: null, timer: null, stopping: false, hasTranscript: false, pendingText: ''
  };
  button.textContent = button === voice ? '음성 입력 종료' : '요청 음성 입력 종료';
  status.textContent = '음성 입력 시작 중…';
  startRecognition(voiceInput);
}

const receiptForm = byId('receipt-form');
const receiptPhoto = byId('receipt-photo');
const receiptStatus = byId('receipt-status');
const receiptFields = byId('receipt-fields');
const receiptDate = byId('receipt-date');
const receiptMerchant = byId('receipt-merchant');
const receiptAmount = byId('receipt-amount');
const receiptSave = byId('receipt-save');
const ocrBase = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1';
let ocrLibrary;

function loadOcr() {
  ocrLibrary ??= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = ocrBase + '/dist/tesseract.min.js';
    script.onload = () => {
      if (window.Tesseract?.createWorker) resolve(window.Tesseract);
      else {
        script.remove();
        reject(new Error());
      }
    };
    script.onerror = () => {
      script.remove();
      reject(new Error());
    };
    document.head.append(script);
  }).catch(error => {
    ocrLibrary = undefined;
    throw error;
  });
  return ocrLibrary;
}

function receiptDetails(text) {
  const lines = text.normalize('NFKC').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const transactionLabel = /거래\s*일|결제\s*일|구매\s*일|승인\s*일|판매\s*일|발행\s*일|일\s*시|(?:transaction|payment)\s*date/i;
  const otherDateLabel = /유효\s*기간|제조\s*일|유통\s*기한|재발행|재출력|출력\s*일/;
  const totalLabels = [
    /실\s*결제\s*(?:금액|액)?|(?:실제|최종|총)\s*(?:결제|승인)\s*(?:금액|액)?|(?:받을|지불할|청구)\s*금액|amount\s*(?:paid|due)|grand\s*total/i,
    /(?:결제|승인|지불|신용카드|카드)\s*(?:금액|합계|액)|합\s*계\s*금\s*액|총\s*(?:금액|합계)|(?:구매|판매)\s*합계/i,
    /합\s*계|\btotal\b/i,
  ];
  const excludedTotal = /부가세|부가가치세|공급가액|면세|과세|소계|할인|받은\s*금액|거스름돈|잔액|포인트|sub\s*total|change|tax|discount/i;
  const merchantLabel = /^(?:가맹점(?:명)?|상\s*호(?:명)?|업체명|판매처|merchant(?:\s*name)?|store\s*name)\s*[:：]?\s*/i;
  const administrativeLine = /영수증|매출\s*전표|고객용|고객\s*보관|사업자|대표자|연락처|전화|주소|승인|거래|단말기|카드번호|품목|수량|단가|합\s*계|결제|receipt|customer\s*copy|merchant\s*copy|tel[.:]/i;
  let date = '';
  let dateRank = 0;
  let merchant = '';
  let amount = 0;
  let amountRank = 0;

  for (const [index, line] of lines.entries()) {
    const previous = lines[index - 1] ?? '';
    const next = lines[index + 1] ?? '';
    const dateLabel = transactionLabel.test(line) || transactionLabel.test(previous);
    const dateMatch = /(?<!\d)(20\d{2}|\d{2})\s*(?:[./-]|년)\s*(\d{1,2})\s*(?:[./-]|월)\s*(\d{1,2})(?!\d)/.exec(line);
    if (dateMatch && !otherDateLabel.test(line) && !otherDateLabel.test(previous)) {
      const [, yearText, monthText, dayText] = dateMatch;
      const year = Number(yearText.length === 2 ? '20' + yearText : yearText);
      const month = Number(monthText);
      const day = Number(dayText);
      const candidate = new Date(Date.UTC(year, month - 1, day));
      const rank = dateLabel ? 2 : 1;
      if (rank > dateRank && candidate.getUTCMonth() === month - 1 && candidate.getUTCDate() === day) {
        date = candidate.toISOString().slice(0, 10);
        dateRank = rank;
      }
    }

    if (!merchant && merchantLabel.test(line)) {
      const name = line.replace(merchantLabel, '').split(/\s+(?:사업자|대표자|전화|주소|TEL\b)/i)[0].trim();
      merchant = name || (!administrativeLine.test(next) && /[가-힣a-z]/i.test(next) ? next : '');
    }

    const labelIndex = totalLabels.findIndex(pattern => pattern.test(line));
    if (labelIndex === -1) continue;
    const label = totalLabels[labelIndex].exec(line);
    const before = line.slice(0, label.index);
    const after = line.slice(label.index + label[0].length);
    if (excludedTotal.test(before) || excludedTotal.test(after)) continue;
    const numbers = /(?:₩\s*)?(\d+(?:\s*,\s*\d{3})*)\s*원?(?![\d.,%:/-])/g;
    const valueText = after.trim() && /[0-9]/.test(after) ? after : /^\s*[:=₩\d,\s원]+\s*$/.test(next) ? next : '';
    const values = [...valueText.matchAll(numbers)];
    const value = Number(values.at(-1)?.[1].replace(/[,\s]/g, ''));
    const rank = totalLabels.length - labelIndex;
    if (Number.isSafeInteger(value) && value > 0 && rank >= amountRank) {
      amount = value;
      amountRank = rank;
    }
  }

  if (!merchant) {
    merchant = lines.slice(0, 8).find(line => /[가-힣a-z]/i.test(line) &&
      !administrativeLine.test(line) && !otherDateLabel.test(line) && !excludedTotal.test(line) &&
      !/\d\s*원/.test(line) &&
      !/(?:19|20)\d{2}|^\s*[#*]|[:：]|(?:시|구|동)\s+.*(?:로|길)\s*\d/.test(line)) ?? '';
  }
  return {date, merchant, amount};
}

receiptPhoto.onchange = async () => {
  const photo = receiptPhoto.files[0];
  if (!photo) return;
  receiptPhoto.disabled = true;
  receiptFields.hidden = true;
  receiptFields.disabled = true;
  receiptDate.value = receiptMerchant.value = receiptAmount.value = '';
  receiptStatus.textContent = '영수증 인식을 준비하고 있습니다…';
  let worker;
  try {
    const ocr = await loadOcr();
    let rejectWorker;
    const workerFailure = new Promise((_, reject) => { rejectWorker = reject; });
    const startup = ocr.createWorker('kor+eng', 1, {
      errorHandler: rejectWorker,
      workerPath: ocrBase + '/dist/worker.min.js',
      logger: progress => {
        if (progress.status === 'recognizing text') {
          receiptStatus.textContent = '영수증 인식 중… ' + Math.round(progress.progress * 100) + '%';
        }
      },
    });
    worker = await Promise.race([startup, workerFailure]);
    const result = await Promise.race([worker.recognize(photo), workerFailure]);
    const details = receiptDetails(result.data.text);
    receiptDate.value = details.date;
    receiptMerchant.value = details.merchant;
    receiptAmount.value = details.amount || '';
    receiptStatus.textContent = details.date && details.merchant && details.amount
      ? '인식된 날짜, 사용처, 금액을 확인한 뒤 저장하세요.'
      : '인식하지 못한 항목을 입력하거나 사진을 다시 촬영해 주세요.';
  } catch {
    receiptStatus.textContent = '사진을 읽지 못했습니다. 인터넷 연결을 확인하고 다시 촬영하거나 아래 항목을 입력해 주세요.';
  } finally {
    if (worker) {
      try { await worker.terminate(); } catch { /* The worker may already have stopped. */ }
    }
    receiptPhoto.value = '';
    receiptPhoto.disabled = false;
    receiptFields.hidden = false;
    receiptFields.disabled = false;
  }
};

receiptForm.onsubmit = async event => {
  event.preventDefault();
  if (receiptFields.disabled || receiptSave.disabled) return;
  const amount = receiptAmount.valueAsNumber;
  const merchant = receiptMerchant.value.trim();
  if (!receiptDate.value || !receiptDate.validity.valid || !merchant || !Number.isSafeInteger(amount) || amount <= 0) {
    receiptStatus.textContent = '결제 날짜, 사용처, 1원 이상의 정수 금액을 입력해 주세요.';
    return;
  }
  receiptSave.disabled = true;
  receiptPhoto.disabled = true;
  try {
    const record = {
      id: newId(),
      date: receiptDate.value,
      category: '지출',
      memo: '사용처: ' + merchant + '\n지출: ' + moneyText(amount),
      receiptAmount: amount,
    };
    await withRecords(records => {
      const updated = [record, ...records];
      writeRecords(updated);
      render(updated);
    });
    receiptForm.reset();
    receiptFields.hidden = true;
    receiptFields.disabled = true;
    receiptStatus.textContent = '영수증을 지출 기록으로 저장했습니다.';
  } catch (error) {
    receiptStatus.textContent = error.message;
  } finally {
    receiptSave.disabled = false;
    receiptPhoto.disabled = false;
  }
};

function refresh() {
  withRecords(render).catch(error => report(error.message, true));
}

filterDate.addEventListener('change', refresh);
filterCategory.addEventListener('change', refresh);
byId('clear-filters').onclick = () => {
  filterDate.value = '';
  filterCategory.value = '';
  refresh();
};

window.addEventListener('storage', event => {
  if (event.key === key || event.key === null) refresh();
});
setEditor();
refresh();
</script>
</body>
</html>
